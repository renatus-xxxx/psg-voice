name: wav2psg (Ubuntu)

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build
      - run: cmake --build build --config Release
      - name: Smoke test
        run: |
          build/wav2psg sample/sample_voice.wav sample_out.h
          grep -c ',' sample_out.h
      - uses: actions/upload-artifact@v4
        with:
          name: wav2psg-ubuntu
          path: build/wav2psg
